<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Assistance MixBar : questions fréquentes et signalement de problèmes.">
    <meta name="theme-color" content="#30202A">
    <link rel="icon" href="icon.png">
    <title>Assistance — MixBar</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body data-page="support" data-title-key="support.title">
    <header class="site-header" id="site-header"></header>
    <main class="page">
      <section class="page-hero">
        <h1 data-i18n="support.title">Assistance</h1>
        <p class="lead" data-i18n="support.lead"></p>
        <div class="hero-actions">
          <a class="btn" data-support-link href="#" data-i18n="support.cta">Signaler un problème</a>
          <a class="btn secondary" data-contact hidden href="#" data-i18n="support.mail">Nous écrire</a>
        </div>
      </section>
      <span class="stripe"></span>
      <section>
        <details><summary data-i18n="support.q1"></summary><p data-i18n="support.a1"></p></details>
        <details><summary data-i18n="support.q2"></summary><p data-i18n="support.a2"></p></details>
        <details><summary data-i18n="support.q3"></summary><p data-i18n="support.a3"></p></details>
        <details><summary data-i18n="support.q4"></summary><p data-i18n="support.a4"></p></details>
      </section>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <script src="app.js"></script>
  </body>
</html>
